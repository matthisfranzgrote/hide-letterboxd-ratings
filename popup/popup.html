<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Extension Popup</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <ul>
            <li>
                <div class="toggle-container">
                    <label class="switch">
                        <input type="checkbox" id="global-toggle" />
                        <span class="slider"></span>
                    </label>
                    <span class="toggle-message">Hide ratings and reviews</span>
                </div>
            </li>
            <li>
                <div class="toggle-container" id="watched-container" inert>
                    <label class="switch">
                        <input type="checkbox" id="watched-toggle" />
                        <span class="slider"></span>
                    </label>
                    <span class="toggle-message">Auto-reveal when watched</span>
                </div>
            </li>
        </ul>
        <script src="popup.js"></script>
    </body>
</html>
