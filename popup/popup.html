<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Extension Popup</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div class="container">
            <div class="toggle-container">
                <span class="toggle-message">Always show</span>
                <label class="switch">
                    <input type="checkbox" id="global-toggle" />
                    <span class="slider"></span>
                </label>
            </div>
            <div class="toggle-container">
                <span class="toggle-message">Always show when watched</span>
                <label class="switch">
                    <input type="checkbox" id="watched-toggle" />
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
